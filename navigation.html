
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  color: #806858;
}

.navigation {
  display: grid;
  grid-template-columns: 1.15fr repeat(5, 1fr);
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px;
}

.date {
  text-align: center;
  min-width: 0;
  padding: 4px;
}

#month {
  font-size: clamp(8px, 1.4vw, 18px);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

#day {
  font-size: clamp(24px, 9vw, 120px);
  line-height: 1.1;
}

#weekday {
  font-size: clamp(12px, 1.8vw, 22px);
  font-style: italic;
}

.line {
  width: 45%;
  height: 1px;
  background: #d7cabc;
  margin: 10px auto;
}

#year {
  font-size: clamp(10px, 1.3vw, 16px);
}

.tile {
  display: block;
  min-width: 0;
  text-decoration: none;
  transition: transform 0.25s ease;
}

.tile img {
  display: block;
  width: 100%;
  aspect-ratio: 740 / 1010;
  object-fit: contain;
}

.tile:hover {
  transform: translateY(-4px);
}

.tile:focus-visible {
  outline: 1px solid #806858;
  outline-offset: 3px;
}
</style>
</head>

<body>

<div class="navigation">

  <div class="date">
    <div id="month"></div>
    <div id="day"></div>
    <div id="weekday"></div>
    <div class="line"></div>
    <div id="year"></div>
  </div>

  <a class="tile"
     href="https://app.notion.com/p/C-lok-41eaaa649cf380d799bad3a4a57f14b8"
     target="_blank" rel="noopener noreferrer">
    <img src="celok.png" alt="Célok">
  </a>

  <a class="tile"
     href="https://app.notion.com/p/Tervez-41eaaa649cf380089cf0c4c373406865"
     target="_blank" rel="noopener noreferrer">
    <img src="tervezo.png" alt="Tervező">
  </a>

  <a class="tile"
     href="https://app.notion.com/p/Karrier-41eaaa649cf380d1ba06e5d5f79e3c2e"
     target="_blank" rel="noopener noreferrer">
    <img src="karrier.png" alt="Karrier">
  </a>

  <a class="tile"
     href="https://app.notion.com/p/P-nz-gyek-41eaaa649cf38008aff3cc6b12c3d13c"
     target="_blank" rel="noopener noreferrer">
    <img src="penzugyek.png" alt="Pénzügyek">
  </a>

  <a class="tile"
     href="https://app.notion.com/p/letm-d-41eaaa649cf380318154db8838fc20f8"
     target="_blank" rel="noopener noreferrer">
    <img src="eletmod.png" alt="Életmód">
  </a>

</div>

<script>
function updateDate() {
  const now = new Date();

  const format = options =>
    new Intl.DateTimeFormat("hu-HU", {
      ...options,
      timeZone: "Europe/Budapest"
    }).format(now);

  document.getElementById("month").textContent =
    format({ month: "long" });

  document.getElementById("day").textContent =
    format({ day: "numeric" }).replace(".", "");

  const weekday = format({ weekday: "long" });

  document.getElementById("weekday").textContent =
    weekday.charAt(0).toUpperCase() + weekday.slice(1);

  document.getElementById("year").textContent =
    format({ year: "numeric" });
}

updateDate();
setInterval(updateDate, 1000);
</script>

</body>
</html>
